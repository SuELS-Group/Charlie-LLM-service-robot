[build-system]
requires = ['setuptools>=61']
build-backend = 'setuptools.build_meta'

[project]
name = "pg-llm-service-robot-robot"
version = "0.1.0"
description = "PG-LLM Service Robot - Robot Components"
requires-python = ">=3.10,<3.12"
dependencies = [
    # === Core / Math ===
    "numpy>=1.24,<2.0.0",
    "scipy>=1.10.0",
    "numba>=0.57.0",
    # === Computer Vision ===
    "opencv-python>=4.8,<4.11",
    # === Audio ===
    "sounddevice>=0.5.3",
    "soundfile>=0.12.0",
    # === Deep Learning (voice detection / Silero VAD) ===
    "torch>=2.0.0",
    # === Hardware / Robot ===
    "pyusb>=1.2.0",
    "hello-robot-stretch-body>=0.6.0",
    # === Configuration / Utilities ===
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "transforms3d>=0.4.0",
    # === ROS2 Build Dependencies (needed at runtime for colcon) ===
    "catkin-pkg>=1.0.0",
    "colcon-common-extensions>=0.3.0",
    "empy==3.3.4",
    "lark>=1.2.0",
    "setuptools>=58.0.0,<59.0.0",
]

[tool.uv]
# Use system Python to ensure ROS2 compatibility
python-preference = 'only-system'

[tool.setuptools.packages.find]
where = ['.']
include = ['robot_common*']
