storage:
  file: ~/.stretch_nav/state/waypoints.json
topics:
  markers: /waypoint/waypoints
services:
  save: /waypoint/save
  save_pose: /waypoint/save_pose
  get: /waypoint/get
  list: /waypoint/list
  delete: /waypoint/delete
frames:
  base: base_link
  map: map
qos:
  depth: 10
marker:
  publish_period_seconds: 1.0
  frame_id: map
  namespace: saved_waypoints
  lifetime_seconds: 1.1
  cylinder:
    scale:
      x: 0.3
      y: 0.3
      z: 0.05
    color:
      r: 1.0
      g: 0.0
      b: 0.0
      a: 0.8
  text:
    namespace: saved_waypoints_text
    position_z: 0.3
    scale_z: 0.15
    color:
      r: 1.0
      g: 1.0
      b: 1.0
      a: 1.0
