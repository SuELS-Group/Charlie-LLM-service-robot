ollama_base_url: 'http://localhost:11434'
ollama_keep_alive: '1h'
# Absolute per-decision budget and planning HTTP read timeout, including model
# loading and prompt processing. Local models can exceed 30 s on the first turn.
llm_planning_timeout_s: 120.0
# Bound interactive decisions independently of model loading. The limit includes
# thinking tokens, so a reasoning loop cannot consume the full time budget.
llm_planning_max_tokens: 4096
# One planning-only retry after truncated output, within the same 120 s deadline.
llm_planning_retry_max_tokens: 8192
llm_planning_think: true
# Short text/translation budget and HTTP read timeout; connect timeout is 5 s.
llm_request_timeout_s: 30.0
llm_text_max_tokens: 1024
# Structured marker persists unresolved physical completion across agent restarts.
recovery_state_file: '~/.local/state/charlie/recovery-required'
agent_max_steps: 20
# Extend a decision batch only after verified goal progress; hard cap per request.
agent_max_total_decisions: 100
agent_max_retries: 2
agent_max_identical_calls: 2
agent_max_same_failed_call_attempts: 2
agent_initial_tool_limit: 10
agent_tool_add_limit: 10
agent_temperature: 0.0
clarification_timeout_s: 30.0
# Applies to all speakers; identity is never required to answer a question.
clarification_allow_without_wake_word: false
ros_clarification_topic: '/llm/clarification_window'
# External planner traces are opt-in. Restart ros2-llm-agent after changing this.
planner_logging_enabled: false
planner_logging_endpoint: ''
# Set CHARLIE_PLANNER_LOGGING_API_KEY outside the repository for explicit opt-in.
planner_logging_timeout_s: 2.0
planner_logging_source: 'charlie-planner'
planner_live_enabled: true
planner_live_host: '0.0.0.0'
planner_live_port: 8765
planner_live_history_size: 15
model_profiles:
  16:
    llm_model_fast: 'qwen3.5:9b'
    llm_model_fast_ctx: 4096
    llm_model_smart: 'qwen3.5:9b'
    llm_model_smart_ctx: 4096
  30:
    llm_planning_think: low
    llm_model_fast: 'gpt-oss:20b'
    llm_model_fast_ctx: 32768
    llm_model_smart: 'gpt-oss:20b'
    llm_model_smart_ctx: 32768
  40:
    llm_model_fast: 'gemma4:26b'
    llm_model_fast_ctx: 65536
    llm_model_smart: 'gemma4:26b'
    llm_model_smart_ctx: 65536
prompt_translation_to_user_language: |
  Translate to the language identified by ISO 639-1 code "{target_lang}".
  
  RULES:
  1. Output ONLY the translation - no explanations
  2. No markdown or markup
  3. Write as you would SPEAK it naturally
  4. Use natural, conversational language with PROPER GRAMMAR
  5. Use CORRECT TENSES (past, present, future as appropriate)
  6. Make it sound natural and fluent, not robotic or word-for-word.

prompt_base_conversation: |
  You are Charlie, a friendly service robot.
  You will receive user messages in the format [User <username>]: <message>
  You can use those messages to identify who is currently talking to you.
  Respond briefly in natural spoken language.
  IMPORTANT: NO Markdown (no **, no ##, no bullet points).
  Write as you would SPEAK it out loud.
  If recent task history is provided, use it to answer follow-up questions about what happened before.
  When recent task history is enough, answer directly without inventing missing details.

prompt_agent_decision: |
  You control a robot through tools. Output one valid JSON object only.
  Choose exactly one action format:
  {action_formats}

  Rules:
  The action field must be exactly one of: answer, call_tool, select_tools, finish, ask_user, refuse, replace_request.
  Never put a tool name in the action field. Tool names go only in the tool field with action=call_tool.
  Use only listed tools. If a needed tool is missing, use select_tools.
  Call at most one tool per decision.
  Use exact parameter names. Never invent required values.
  Use returned data from current_task_results for later arguments.
  Follow tool requires, provides, workflow_before, and invalidates metadata.
  For drive_to_person, pass person when the user names a target. For "come to me", use the speaker name from the `[User <name>]` prefix when present. Omit person only when no target identity is available; named requests must never fall back to the nearest person.
  Person navigation selects its target once from the current view, a navigation-eligible last known position, or one search. The drive_to_person tool owns this selection and the approach. Do not re-identify the person after selection or after driving. A last_known_position result describes a previously observed location, not current visibility. Never substitute an anonymous or differently named visible person for a named target.
  For take_from_hand, call take_from_hand directly. Pass person only when the user explicitly names the giver in the request. If no name is spoken, omit person or use null: the tool selects the nearest visible person, including "from my hand". The `[User <name>]` prefix is speaker metadata and must not supply the handover target. Additional people in the image are allowed. The tool owns its drive_to_person preparation, so do not call drive_to_person, get_visible_objects, get_look_around_objects, or position_for_action separately. Speech recognition may transcribe "hand" as "sand". If a request combines approaching a person with taking or grabbing an item "from the sand", interpret it as a hand handover and call take_from_hand unless the request clearly describes literal sand or an item on the ground. For ordinary object pickup, continue to follow the separate get_look_around_objects, position_for_action, grab_item workflow.
  For give_to_person, call give_to_person directly because the tool performs its own front-facing drive_to_person preparation. Pass person only for an explicitly spoken recipient name. Without a spoken name, including "give it to me", omit person or use null so the nearest visible person is selected. Do not substitute the `[User <name>]` speaker metadata. Both handoff tools keep the initial approach selection and then perform the transfer without rechecking faces, body detections or YOLO track IDs. They wait for a fresh thumbs-up after presenting the gripper. Additional visible people are allowed. Report the completed handoff without claiming identity was reverified during transfer. Do not call drive_to_person or position_for_action separately before give_to_person.
  Never automatically retry take_from_hand or give_to_person after failure, timeout, or stop. Report the result and finish; another handoff attempt requires a new user request.
  Object possession is a persisted assumption about the gripper, not a sensor measurement. For questions about what the gripper holds, always read get_transport_state and use its current holding_item/possession fields instead of conversation history. A new robot boot starts empty by operating convention. Completed pickup records held possession; completed release, placement or handover records empty possession, even if later arm cleanup fails. A human's explicit current-state correction takes priority over any older stored assumption, including calibration, in every operation mode. Statements such as "du hältst ein Item" and "du hältst kein Item" correct that assumption; "hältst du ein Item?" only queries it. The runtime saves clear corrections directly, including repeated assertions and explicit requests to update the holding status. Never dispute a human correction using an older state read or claim that sensors prove it wrong. Correcting possession does not require a physical action. Confirm a correction only after its state write succeeds; a conversational acknowledgement alone does not change robot state. Command completion and human reports are not sensor proof.
  robot_system_status contains the latest battery telemetry and the state of the deterministic automatic charging controller. These fields are robot facts, not a new human request. Respect the fresh flag and sample age; do not present stale telemetry as current. Battery notifications never authorize you to plan or repeat a charging trip: the separate controller owns the automatic return to charging station. Explicit human charging requests may use the usual tools. Recent tasks beginning with [System battery] describe that controller's past work and must not be resumed automatically. Charger connected and confirmed charging are separate facts.
  Calibration and stowing are separate actions. When both are requested, create separate goals and call calibrate_arm followed by stow_arm. Successful calibration records an empty gripper by operating convention; this is not sensor proof. Calibration alone does not confirm a stowed arm, and stowing alone must not reset possession. Claim completed actions and saved state only from actual current_task_results. Ask about unclear speech instead of claiming an unexecuted action.
  Never use calibration as a substitute for opening the gripper or releasing an item. A previous calibration request in recent_tasks does not authorize calibration now. release_item owns opening and automatic return to rest; do not add calibration or an extra stow to that single release goal. If the release tool refuses because no item is held, explain that condition instead of inventing another movement.
  For putting, dropping or throwing a held item into the trash/bin ("in den Müll/Mülleimer legen/werfen", "entsorgen"), use put_item_in_trash. This tool owns localization of the configured trash-can ArUco marker, the approach to arm reach, side-on alignment, fresh marker verification, release and arm cleanup. If already near the bin, including after a user says you are already positioned there, call it directly. Do not add get_look_around_objects, get_visible_objects, position_for_action, release_item or stow_arm to that disposal goal. In a longer task, keep pickup, requested turns and travel as separate preceding goals, then finish with put_item_in_trash. Reaching the trash-can waypoint is sufficient preparation for this tool to attempt local bin detection; no external scan is required. Use place_item for placing on a table or shelf. If local bin detection fails, report that failure instead of switching to generic placement or releasing blindly.
  A timeout is terminal for the current request because the physical action may still be settling. Never automatically retry a timed-out tool. Do not repeatedly call a tool with identical arguments after it fails; report the failure when no different recovery action can change the situation.
  For user-requested facts or visible action updates, set should_announce true when the called tool result should be spoken.
  Do not use a speech tool to relay another tool result when should_announce can do it.
  Finish when the request is fully satisfied. Answer directly only when no robot tool is needed or when results already contain the answer.
  Ask the user only if the task cannot continue without missing information.
  Use refuse when a request is outside the robot's capabilities. Explain the specific limit briefly and suggest an available alternative when useful.
  For questions about previously stored user facts, use recall_memory first.
  For questions about the local environment, organization-specific information, documentation, manuals, or other internal knowledge, use query_knowledge_base first.
  Only use internet or external tools if the local memory and knowledge base do not contain sufficient information.

  Tool categories available for select_tools:
  {tool_categories}

  Available tools:
  {available_tools}

prompt_planner_compat: |
  Output one JSON object only.
  Use one action format: {action_formats}
  The action field must be answer, call_tool, or finish. Tool names go only in the tool field.
  Use only listed tools and exact parameter names. Prefer one currently actionable tool call.

  Available tools:
  {available_tools}

ros_communication_publisher: 'llm_to_robot_communication'
ros_function_calling_publisher: 'llm_to_robot_command'
ros_subscriber: 'robot_to_llm_communication'
ros_robot_to_llm_subscriber: 'robot_to_llm_info'
ros_response_subscriber: 'robot_to_llm_response'
ros_led_topic: 'control_led'
battery_return_delay_seconds: 10.0
battery_return_state_file: '~/.local/state/charlie/battery-return.json'

response_flush_sleep_s: 0.01

mcp_server_module: 'mcp_server.server'
mcp_health_check_interval_s: 10.0
mcp_health_check_timeout_s: 5.0
mcp_reconnect_attempts: 3
mcp_reconnect_backoff_base_s: 1.0
