[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-llm-service-robot-workstation"
version = "0.1.0"
description = "PG-LLM Service Robot - Workstation Components"
requires-python = ">=3.10,<3.12"
dependencies = [
    # === ML/AI Dependencies ===
    # Speech recognition
    "faster-whisper>=1.2.1",
    # Speaker recognition
    "speechbrain>=1.0.0",
    # TTS (Text-to-Speech)
    "sherpa-onnx==1.12.35",
    # Computer Vision / Object Detection
    "ultralytics>=8.4.6",
    "lap>=0.5.12",
    "opencv-python>=4.8,<4.11",
    "face_recognition>=1.3.0",
    "mediapipe>=0.10.14,<0.10.30",
    # Deep Learning
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "onnxruntime>=1.15.0",
    # === LLM/Agent Dependencies ===
    "openai>=1.0.0",
    "ollama>=0.6.1",
    "jsonschema>=4.18",
    # === Knowledge / RAG ===
    "chromadb>=0.6.0",
    # MCP (Model Context Protocol)
    "mcp>=1.25.0",
    "fastmcp>=2.14.2",
    "websockets>=12.0",
    # === Utilities ===
    "numpy>=1.24,<2.0.0",
    "langdetect>=1.0.9",
    "PyYAML>=6.0",
    "sounddevice>=0.5.3",
    # === ROS2 Build Dependencies (needed at runtime for colcon) ===
    "catkin-pkg>=1.0.0",
    "colcon-common-extensions>=0.3.0",
    "empy==3.3.4",
    "lark>=1.2.0",
    "setuptools>=58.0.0,<59.0.0",
    "websockets>=12.0",
    "torchcodec==0.10.0",
    "opencv-python-headless==4.10.0.84",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.0,<2.0",
]

[tool.uv]
# Use system Python to ensure ROS2 compatibility
python-preference = "only-system"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_node*", "mcp_server*", "workstation_common*"]
